server {
    listen 10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for Fast Three.js and Bundle Loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Support client-side routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache compiled assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Support 3D models, textures, media, and fonts
    location ~* \.(?:glb|gltf|bin|wasm|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Avoid logging favicon and robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
