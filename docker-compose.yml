services:
  backend:
    build:
      context: ./backend
    container_name: nexaura-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: nexaura-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped